<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bird Nerd — for people who look up</title>
  <meta name="description" content="Bird Nerd: shirts, bags and flashcards for Australian bird lovers. Coming soon.">
  <style>
    :root {
      --ink: #1f2a24;
      --paper: #faf7f0;
      --accent: #2f6b4f;
      --accent-soft: #dcebe2;
      --muted: #6b7a72;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Georgia, 'Times New Roman', serif;
      background: var(--paper);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 1.5rem 2rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .logo {
      font-size: 1.9rem;
      line-height: 1;
    }
    .wordmark {
      font-size: 1.25rem;
      letter-spacing: 0.06em;
      font-weight: bold;
      text-transform: uppercase;
    }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 3rem 1.5rem;
    }
    .badge {
      display: inline-block;
      background: var(--accent-soft);
      color: var(--accent);
      font-family: system-ui, sans-serif;
      font-size: 0.75rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 0.4rem 0.9rem;
      border-radius: 999px;
      margin-bottom: 1.5rem;
    }
    h1 {
      font-size: clamp(2.2rem, 6vw, 3.8rem);
      max-width: 16ch;
      line-height: 1.1;
      margin-bottom: 2.5rem;
    }
    .portrait {
      width: clamp(160px, 40vw, 220px);
      height: clamp(160px, 40vw, 220px);
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid var(--accent-soft);
      box-shadow: 0 6px 20px rgba(31, 42, 36, 0.14);
      display: block;
    }
    .byline {
      margin-top: 1rem;
      font-family: system-ui, sans-serif;
      font-size: 0.9rem;
    }
    .byline a {
      color: var(--accent);
      text-decoration-color: var(--accent-soft);
      text-underline-offset: 0.2em;
    }
    .byline a:hover,
    .byline a:focus-visible {
      text-decoration-color: var(--accent);
    }
    /* content sits above the flock, so the birds fly behind the words */
    header, main, footer { position: relative; z-index: 2; }

    /* --- flock --- */
    .flock {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 1;
    }
    .flock-bird {
      position: absolute;
      left: 0;
      top: 0;
      width: 52px;
      height: 32px;
      transform-origin: 24px 17px;
      will-change: transform;
      /* keeps the pale birds (cockatoo, galah) off the cream background */
      filter: drop-shadow(0 1px 1.5px rgba(31, 42, 36, 0.22));
    }
    .flock-bird svg { display: block; overflow: visible; }

    /* --- bird cursor --- */
    html.bird-cursor-on,
    html.bird-cursor-on * { cursor: none; }
    .bird-cursor {
      position: fixed;
      left: 0;
      top: 0;
      width: 48px;
      height: 32px;
      pointer-events: none;
      z-index: 9999;
      /* pivot on the beak tip so the bird turns about the real pointer */
      transform-origin: 46px 16.2px;
      opacity: 0;
      transition: opacity 0.25s ease;
      will-change: transform;
      filter: drop-shadow(0 2px 3px rgba(31, 42, 36, 0.25));
    }
    .bird-cursor svg { display: block; overflow: visible; }
    footer {
      text-align: center;
      padding: 1.5rem;
      color: var(--muted);
      font-family: system-ui, sans-serif;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>
  <header>
    <span class="logo">🦜</span>
    <span class="wordmark">Bird Nerd</span>
  </header>
  <main>
    <span class="badge">Coming soon</span>
    <h1>Good things come to those who look up.</h1>
    <img class="portrait" src="assets/me.webp" width="640" height="640"
         alt="Me, with a green rosella perched on my head.">
    <p class="byline">
      <a href="https://www.linkedin.com/in/hannahbarrenger/"
         target="_blank" rel="noopener">Me</a>
    </p>
  </main>
  <footer>
    © 2026 Bird Nerd · Australia
  </footer>

  <div class="flock" id="flock" aria-hidden="true"></div>

  <div class="bird-cursor" id="birdCursor" aria-hidden="true">
    <svg viewBox="0 0 48 32" width="48" height="32">
      <path id="farWing" fill="#24523c"
            d="M24 17 Q 17 6 5 3 Q 13 13 16 18 Z"/>
      <g fill="#2f6b4f">
        <path d="M11 18 L1 12.5 L3.5 18 L1 23.5 Z"/>
        <ellipse cx="22" cy="18" rx="11" ry="5.6"/>
        <circle cx="33.5" cy="15" r="4.6"/>
      </g>
      <path d="M37.8 15 L46 16.2 L37.8 17.8 Z" fill="#d98b2b"/>
      <circle cx="35" cy="13.6" r="0.9" fill="#faf7f0"/>
      <path id="nearWing" fill="#3d8560"
            d="M23 17 Q 16 5 3 1 Q 12 12 15 18 Z"/>
    </svg>
  </div>

  <script>
    /* ------------------------------------------------------------------
       Flock — Reynolds boids (separation / alignment / cohesion) with a
       seek-and-orbit term pulling the flock toward the pointer.
       ------------------------------------------------------------------ */
    (function () {
      var host = document.getElementById('flock');
      if (!host) return;
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

      var TAU = Math.PI * 2, DEG = 180 / Math.PI;
      var W = window.innerWidth, H = window.innerHeight;

      function rnd(a, b) { return a + Math.random() * (b - a); }

      // ---- tuning ----------------------------------------------------
      var NEIGHBOUR = 78;    // radius for alignment + cohesion
      var SEPARATE  = 30;    // radius for personal space
      var W_SEP = 1.9, W_ALI = 1.05, W_COH = 0.85, W_SEEK = 1.3, W_WANDER = 0.4;

      // ---- Australian species ----------------------------------------
      // body/chest/head/nape/cheek/crest, two wing tones, tail, beak shape.
      var SPECIES = [
        { n:'Galah', body:'#e08aa0', chest:'#e8a2b5', head:'#f2d3dc', wingN:'#a9b1b9', wingF:'#7d858d', tail:'#9aa2aa', beak:'#d9cfbe', bk:'parrot', crest:'cockatoo', crestC:'#f7e2e9', size:1.05 },
        { n:'Sulphur-crested Cockatoo', body:'#f6f2e8', chest:'#fbf8f0', head:'#f8f5ec', wingN:'#e6e0d2', wingF:'#cdc6b6', tail:'#e2dbcb', beak:'#4a463f', bk:'parrot', crest:'cockatoo', crestC:'#f0cb45', size:1.12 },
        { n:'Rainbow Lorikeet', body:'#3d8f3a', chest:'#dd5528', head:'#2b5ea6', wingN:'#46a03f', wingF:'#2f7a2e', tail:'#2f7a2e', beak:'#e8802a', bk:'parrot', size:0.95 },
        { n:'Laughing Kookaburra', body:'#e6dac2', chest:'#f0e8d6', head:'#cbbb9c', nape:'#8a6a45', wingN:'#7a6041', wingF:'#5d4830', patch:'#2f6fa8', tail:'#6b5335', beak:'#3d382f', bk:'dagger', size:1.15 },
        { n:'Crimson Rosella', body:'#c0242b', chest:'#cf2f34', head:'#bb2028', cheek:'#2a4f9b', wingN:'#8f1c22', wingF:'#6d151a', tail:'#2a4f9b', beak:'#d8cfc0', bk:'parrot', size:1.0 },
        { n:'Australian Magpie', body:'#2b2a28', chest:'#33322f', head:'#242322', nape:'#f2f0ea', wingN:'#eae7e0', wingF:'#3a3936', tail:'#2b2a28', beak:'#cdd5db', bk:'point', size:1.1 },
        { n:'Green Rosella', body:'#9aad38', chest:'#c8cf42', head:'#d2d64a', cheek:'#3a5fa8', wingN:'#7f9a33', wingF:'#4f6b28', tail:'#3f6b8a', beak:'#d8cfc0', bk:'parrot', size:1.0 },
        { n:'Gang-gang Cockatoo', body:'#7c7f84', chest:'#8b8e93', head:'#b03029', wingN:'#6e7176', wingF:'#565a5f', tail:'#5f6266', beak:'#cfc6b4', bk:'parrot', crest:'gangang', crestC:'#c23a30', size:1.05 },
        { n:'Eastern Rosella', body:'#4a8c3d', chest:'#e6c33f', head:'#c3252a', cheek:'#f4f1e8', wingN:'#3f7a34', wingF:'#2d5926', tail:'#3f6b8a', beak:'#d8cfc0', bk:'parrot', size:1.0 },
        { n:'Superb Fairy-wren', body:'#3a3936', chest:'#e8e2d2', head:'#2f7fd0', cheek:'#7fb8e8', wingN:'#5a5a54', wingF:'#41413c', tail:'#2a4f8a', tailLen:2.0, beak:'#2b2a28', bk:'point', size:0.68 },
        { n:'Willie Wagtail', body:'#2a2927', chest:'#f2f0ea', head:'#242322', wingN:'#3a3936', wingF:'#2a2927', tail:'#2a2927', tailLen:1.7, beak:'#242322', bk:'point', size:0.72 },
        { n:'Budgerigar', body:'#7bbf3f', chest:'#8fc94c', head:'#e4da48', wingN:'#5f6b3a', wingF:'#464f2b', tail:'#3f5f8a', beak:'#cfc6b4', bk:'parrot', size:0.75 },
        { n:'Red-tailed Black Cockatoo', body:'#2a2724', chest:'#332f2b', head:'#221f1d', wingN:'#3a3632', wingF:'#221f1d', tail:'#b8352c', beak:'#c9bfad', bk:'parrot', crest:'cockatoo', crestC:'#2a2724', size:1.18 },
        { n:'Rainbow Bee-eater', body:'#3fa08a', chest:'#e6c94a', head:'#4faa74', wingN:'#c78a3a', wingF:'#8f6a2a', tail:'#2f6b7a', tailLen:1.8, beak:'#242322', bk:'dagger', size:0.8 },
        { n:'Scarlet Honeyeater', body:'#cb2a27', chest:'#e0413a', head:'#c02220', wingN:'#6b3a30', wingF:'#4a2a24', tail:'#5a332b', beak:'#2b2a28', bk:'point', size:0.62 },
        { n:'Welcome Swallow', body:'#2c3f68', chest:'#e8dcc8', head:'#2a3a60', cheek:'#b5552e', wingN:'#35497a', wingF:'#22304f', tail:'#22304f', tailLen:1.9, beak:'#242322', bk:'point', size:0.72 }
      ];

      var BEAKS = {
        parrot: 'M37.2 14.2 Q 43.2 14.4 42.4 17.2 Q 40.6 18.8 37.6 18.1 Z',
        point:  'M37.8 15 L46.5 16.2 L37.8 17.8 Z',
        dagger: 'M37.8 15.2 L49 16.4 L37.8 17.7 Z'
      };
      var CRESTS = {
        cockatoo: 'M30.5 11.5 Q 32 1.5 38.5 4 Q 34.5 8.5 35.6 11.8 Z',
        gangang:  'M31 11.5 Q 33 4.5 36.8 6.8 Q 35 9.6 35.9 11.9 Z'
      };

      function makeBird(sp) {
        var tipX = rnd(0, 7), tipY = rnd(-3, 3);          // wing tip varies per bird
        var tl = sp.tailLen || 1;
        var svg =
          '<svg viewBox="0 0 52 32" width="52" height="32">' +
            '<path class="fw" fill="' + sp.wingF + '" d="M24 17 Q 17 6 ' + (tipX + 2) + ' ' + (tipY + 3) + ' Q 13 13 16 18 Z"/>' +
            '<path fill="' + sp.tail + '" d="M11 18 L' + (11 - 10 * tl) + ' 12.5 L' + (11 - 7 * tl) + ' 18 L' + (11 - 10 * tl) + ' 23.5 Z"/>' +
            '<ellipse cx="22" cy="18" rx="11" ry="5.6" fill="' + sp.body + '"/>' +
            (sp.chest ? '<ellipse cx="28" cy="19.4" rx="6" ry="4.1" fill="' + sp.chest + '"/>' : '') +
            (sp.nape  ? '<ellipse cx="29.8" cy="13.2" rx="3.4" ry="2.7" fill="' + sp.nape + '"/>' : '') +
            (sp.crest ? '<path fill="' + sp.crestC + '" d="' + CRESTS[sp.crest] + '"/>' : '') +
            '<circle cx="33.5" cy="15" r="4.6" fill="' + sp.head + '"/>' +
            (sp.cheek ? '<circle cx="34.8" cy="16.6" r="1.9" fill="' + sp.cheek + '"/>' : '') +
            '<path fill="' + sp.beak + '" d="' + BEAKS[sp.bk] + '"/>' +
            '<circle cx="35" cy="13.6" r="0.95" fill="#1d1b19"/>' +
            '<circle cx="35.3" cy="13.3" r="0.32" fill="#fff" opacity=".85"/>' +
            (sp.patch ? '<ellipse cx="19" cy="16.4" rx="4.2" ry="2.3" fill="' + sp.patch + '" transform="rotate(-12 19 16.4)"/>' : '') +
            '<path class="nw" fill="' + sp.wingN + '" d="M23 17 Q 16 5 ' + tipX + ' ' + tipY + ' Q 12 12 15 18 Z"/>' +
          '</svg>';

        var el = document.createElement('div');
        el.className = 'flock-bird';
        el.innerHTML = svg;

        var ang = rnd(0, TAU), sp0 = rnd(90, 170);
        return {
          species: sp.n,
          el: el,
          nw: el.querySelector('.nw'),
          fw: el.querySelector('.fw'),
          x: rnd(0, W), y: rnd(0, H),
          vx: Math.cos(ang) * sp0, vy: Math.sin(ang) * sp0,
          maxSpeed: rnd(230, 400),
          maxForce: rnd(700, 1100),
          // depth variety, nudged by the species' real-world size
          scale: rnd(0.34, 0.74) * (sp.size || 1),
          ring: rnd(34, 118),            // personal orbit radius round the pointer
          swirl: Math.random() < 0.5 ? -1 : 1,
          flapMul: rnd(0.85, 1.45),
          phase: rnd(0, TAU),
          wander: rnd(0, TAU),
          heading: ang
        };
      }

      var COUNT = Math.max(9, Math.min(24, Math.round(W * H / 48000)));

      // shuffled round-robin: every species shows up before any repeats
      var bag = SPECIES.slice();
      for (var s0 = bag.length - 1; s0 > 0; s0--) {
        var k = Math.floor(Math.random() * (s0 + 1));
        var t0 = bag[s0]; bag[s0] = bag[k]; bag[k] = t0;
      }

      var birds = [];
      var frag = document.createDocumentFragment();
      for (var i = 0; i < COUNT; i++) {
        var b = makeBird(bag[i % bag.length]);
        birds.push(b);
        frag.appendChild(b.el);
      }
      host.appendChild(frag);

      // ---- what the flock chases -------------------------------------
      var hasPointer = false;
      var tx = W * 0.5, ty = H * 0.45;
      var drift = 0;

      window.addEventListener('mousemove', function (e) {
        hasPointer = true; tx = e.clientX; ty = e.clientY;
      }, { passive: true });
      window.addEventListener('touchmove', function (e) {
        if (!e.touches.length) return;
        hasPointer = true; tx = e.touches[0].clientX; ty = e.touches[0].clientY;
      }, { passive: true });
      window.addEventListener('resize', function () {
        W = window.innerWidth; H = window.innerHeight;
      });

      function limit(x, y, max) {
        var m = Math.sqrt(x * x + y * y);
        if (m > max && m > 0) { var k = max / m; return [x * k, y * k]; }
        return [x, y];
      }

      var last = 0;
      function step(now) {
        var dt = last ? Math.min((now - last) / 1000, 0.04) : 0.016;
        last = now;

        // with no pointer yet, wander a slow Lissajous so the flock still flies
        if (!hasPointer) {
          drift += dt * 0.32;
          tx = W * (0.5 + 0.32 * Math.sin(drift));
          ty = H * (0.42 + 0.24 * Math.sin(drift * 1.37));
        }

        for (var i = 0; i < birds.length; i++) {
          var b = birds[i];
          var sepX = 0, sepY = 0, sepN = 0;
          var aliX = 0, aliY = 0, cohX = 0, cohY = 0, nbr = 0;

          for (var j = 0; j < birds.length; j++) {
            if (i === j) continue;
            var o = birds[j];
            var dx = o.x - b.x, dy = o.y - b.y;
            var d2 = dx * dx + dy * dy;
            if (d2 > NEIGHBOUR * NEIGHBOUR || d2 === 0) continue;
            var d = Math.sqrt(d2);

            // 1. separation — steer away, weighted by 1/d so close is urgent
            if (d < SEPARATE) { sepX -= dx / d / d; sepY -= dy / d / d; sepN++; }
            // 2. alignment — match neighbours' heading
            aliX += o.vx; aliY += o.vy;
            // 3. cohesion — drift toward the local centre of mass
            cohX += o.x; cohY += o.y;
            nbr++;
          }

          var fx = 0, fy = 0, s;
          if (sepN) {
            s = limit(sepX * 6000, sepY * 6000, b.maxForce);
            fx += s[0] * W_SEP; fy += s[1] * W_SEP;
          }
          if (nbr) {
            s = limit(aliX / nbr - b.vx, aliY / nbr - b.vy, b.maxForce);
            fx += s[0] * W_ALI; fy += s[1] * W_ALI;
            s = limit((cohX / nbr - b.x) * 2.2, (cohY / nbr - b.y) * 2.2, b.maxForce);
            fx += s[0] * W_COH; fy += s[1] * W_COH;
          }

          // seek the pointer, but hold a personal ring and circle it, so the
          // flock forms a swirling shell instead of collapsing to one point
          var gx = tx - b.x, gy = ty - b.y;
          var gd = Math.sqrt(gx * gx + gy * gy) || 1;
          var nx = gx / gd, ny = gy / gd;
          var radial = (gd - b.ring) / 150;                  // <0 = too close
          radial = Math.max(-1, Math.min(1, radial)) * b.maxSpeed;
          var tanW = b.maxSpeed * 0.85 * (1 - Math.min(1, Math.abs(gd - b.ring) / 260));
          var desX = nx * radial + -ny * b.swirl * tanW;
          var desY = ny * radial + nx * b.swirl * tanW;
          s = limit(desX - b.vx, desY - b.vy, b.maxForce);
          fx += s[0] * W_SEEK; fy += s[1] * W_SEEK;

          // a little noise so it never looks mechanical
          b.wander += rnd(-3.2, 3.2) * dt;
          fx += Math.cos(b.wander) * b.maxForce * W_WANDER;
          fy += Math.sin(b.wander) * b.maxForce * W_WANDER;

          // integrate
          b.vx += fx * dt; b.vy += fy * dt;
          var v = limit(b.vx, b.vy, b.maxSpeed);
          b.vx = v[0]; b.vy = v[1];
          b.x += b.vx * dt; b.y += b.vy * dt;

          // wrap with a margin so nobody pops in mid-screen
          var m = 70;
          if (b.x < -m) b.x = W + m; else if (b.x > W + m) b.x = -m;
          if (b.y < -m) b.y = H + m; else if (b.y > H + m) b.y = -m;

          // ---- draw --------------------------------------------------
          var speed = Math.sqrt(b.vx * b.vx + b.vy * b.vy);
          var eff = Math.min(speed / b.maxSpeed, 1);
          b.phase += (3 + eff * 11) * b.flapMul * dt * TAU;
          if (b.phase > TAU) b.phase -= TAU;
          var wing = Math.sin(b.phase) * (14 + eff * 34);
          b.nw.setAttribute('transform', 'rotate(' + (-wing) + ' 23.5 17)');
          b.fw.setAttribute('transform', 'rotate(' + (-wing * 0.62) + ' 23.5 17)');

          var want = Math.atan2(b.vy, b.vx);
          var dh = want - b.heading;
          while (dh > Math.PI) dh -= TAU;
          while (dh < -Math.PI) dh += TAU;
          b.heading += dh * Math.min(1, dt * 9);
          var flip = Math.abs(b.heading) > Math.PI / 2 ? -1 : 1;

          b.el.style.transform =
            'translate3d(' + (b.x - 24) + 'px,' + (b.y - 17) + 'px,0) ' +
            'rotate(' + (b.heading * DEG) + 'deg) ' +
            'scale(' + b.scale + ',' + (b.scale * flip) + ')';
        }
        requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    })();

    (function () {
      var el = document.getElementById('birdCursor');
      if (!el) return;

      // Only for real pointers, and never when reduced motion is requested —
      // hiding the native cursor is hostile if the replacement can't move.
      if (!window.matchMedia('(pointer: fine)').matches) return;
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

      var nearWing = document.getElementById('nearWing');
      var farWing = document.getElementById('farWing');
      var TAU = Math.PI * 2;
      var DEG = 180 / Math.PI;

      // shoulder point the wings pivot around, in viewBox units
      var SX = 23.5, SY = 17;

      var targetX = 0, targetY = 0;          // where the pointer actually is
      var x = 0, y = 0;                      // where the bird is drawn
      var heading = 0, phase = 0;
      var shown = false, primed = false;
      var last = 0;

      document.documentElement.classList.add('bird-cursor-on');

      window.addEventListener('mousemove', function (e) {
        targetX = e.clientX;
        targetY = e.clientY;
        if (!primed) { x = targetX; y = targetY; primed = true; }
        if (!shown) { shown = true; el.style.opacity = '1'; }
      }, { passive: true });

      // don't leave a stray bird hovering when the pointer leaves the page
      document.addEventListener('mouseleave', function () {
        shown = false;
        el.style.opacity = '0';
      });
      document.addEventListener('mouseenter', function () {
        if (primed) { shown = true; el.style.opacity = '1'; }
      });

      function frame(now) {
        var dt = last ? Math.min((now - last) / 1000, 0.05) : 0.016;
        last = now;

        // ease toward the pointer; tight enough to still aim with
        var prevX = x, prevY = y;
        x += (targetX - x) * Math.min(1, dt * 18);
        y += (targetY - y) * Math.min(1, dt * 18);

        var vx = x - prevX, vy = y - prevY;
        var speed = Math.sqrt(vx * vx + vy * vy) / (dt || 0.016); // px/sec
        var eff = Math.min(speed / 1400, 1);                      // 0..1

        // flap rate and wing throw both scale with speed; a slow idle
        // flutter keeps it alive when the pointer is parked
        var rate = 2.6 + eff * 15;
        var amp = 11 + eff * 40;
        phase += rate * dt * TAU;
        if (phase > TAU) phase -= TAU;

        var wing = Math.sin(phase) * amp;
        nearWing.setAttribute('transform', 'rotate(' + (-wing) + ' ' + SX + ' ' + SY + ')');
        farWing.setAttribute('transform', 'rotate(' + (-wing * 0.62) + ' ' + SX + ' ' + SY + ')');

        // face the direction of travel, but only once actually moving,
        // so a parked bird doesn't spin on pixel jitter
        if (speed > 45) {
          var want = Math.atan2(vy, vx);
          var d = want - heading;
          while (d > Math.PI) d -= TAU;
          while (d < -Math.PI) d += TAU;
          heading += d * Math.min(1, dt * 12);
        }

        // flip rather than fly upside down when heading left
        var flip = Math.abs(heading) > Math.PI / 2 ? -1 : 1;
        // gentle bob while gliding
        var bob = (1 - eff) * Math.sin(phase * 0.5) * 1.5;

        el.style.transform =
          'translate3d(' + (x - 46) + 'px,' + (y - 16.2 + bob) + 'px,0) ' +
          'rotate(' + (heading * DEG) + 'deg) scaleY(' + flip + ')';

        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
