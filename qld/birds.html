<head>

<style>
:root{--paper:#f7f5ef;--card:#ffffff;--ink:#22251e;--mut:#5c614f;--acc:#2e6e5e;--warn:#a4432a;--line:#d8d6c8;--pagetext:#22251e;--btnbg:#ffffff;--lead:#8a8d78}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#1a1c17;--pagetext:#e8e6da;--mut:#a8ad98;--line:#3a3d33;--btnbg:#24261f;--acc:#5aa48f}}
:root[data-theme="dark"]{--paper:#1a1c17;--pagetext:#e8e6da;--mut:#a8ad98;--line:#3a3d33;--btnbg:#24261f;--acc:#5aa48f}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--pagetext);font-family:"Avenir Next","Segoe UI",system-ui,sans-serif;
  padding:0 env(safe-area-inset-right) 60px env(safe-area-inset-left)}
.ic{width:1.2em;height:1.2em;vertical-align:-.25em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bar{position:sticky;top:0;z-index:2;background:var(--paper);border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top) + 8px) 0 10px}
.bar .in,.wrap{max-width:760px;margin:0 auto;padding:0 16px}
.top{display:flex;align-items:center;gap:10px}
.home{display:flex;align-items:center;gap:6px;margin-right:auto;color:inherit;text-decoration:none;min-width:0}
.home .logo{font-size:22px;line-height:1}
.home .ttl{font-weight:600;font-size:15px;white-space:nowrap}
.home .ttl em{color:var(--acc);font-style:normal}
.pill{font:inherit;font-size:14px;color:var(--pagetext);background:var(--btnbg);border:1px solid var(--line);border-radius:999px;
  padding:7px 14px;text-decoration:none;white-space:nowrap;cursor:pointer}
.pill:hover{border-color:var(--acc);color:var(--acc)}
h1{font-size:24px;font-weight:600;margin:16px 0 2px}
.sub{color:var(--mut);font-size:14px;margin-bottom:12px}
.search{display:block;position:relative;margin-top:10px}
.search .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--mut)}
#q{width:100%;font:inherit;font-size:16px;color:var(--pagetext);background:var(--btnbg);border:1px solid var(--line);
  border-radius:999px;padding:9px 14px 9px 38px;-webkit-appearance:none;appearance:none}
#q:focus{outline:none;border-color:var(--acc)}
.by{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:9px;font-size:13px;color:var(--mut)}
.by button{font:inherit;font-size:13px;color:var(--mut);background:var(--btnbg);border:1px solid var(--line);border-radius:999px;
  padding:5px 12px;cursor:pointer}
.by button:hover{border-color:var(--acc);color:var(--acc)}
.by button[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:#fff}
#count{margin-left:auto;font-size:13px;color:var(--mut)}
.grp{margin-top:18px}
.grp h2{display:flex;align-items:baseline;gap:8px;font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--acc);
  padding-bottom:5px;border-bottom:1px solid var(--line);margin-bottom:2px}
.grp h2 i{letter-spacing:0;text-transform:none;font-size:12px;color:var(--mut)}
.grp h2 span{margin-left:auto;letter-spacing:0;color:var(--mut);font-weight:400}
.bird{display:flex;align-items:center;gap:12px;padding:7px 4px;border-radius:8px;color:inherit;text-decoration:none}
.bird:hover,.bird:focus-visible{background:rgba(128,128,110,.12)}
.bird img{width:52px;height:52px;flex:none;border-radius:8px;background:#fff;object-fit:contain;border:1px solid var(--line)}
.nm{display:flex;flex-direction:column;min-width:0;flex:1}
.nm b{font-weight:600;font-size:15.5px}
.nm i{font-size:13px;color:var(--mut)}
.nm small{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.k{flex:none;color:var(--acc);font-size:12px;font-weight:600}
mark{background:none;color:var(--acc);font-weight:inherit}
.none{margin-top:30px;text-align:center;color:var(--mut)}
@media (max-width:440px){.home .ttl{display:none}h1{font-size:21px}}
</style>
</head>

<script>
(()=>{
const D=JSON.parse(document.getElementById('birds').textContent);
const REG=Object.fromEntries(D.regions);
// [n (deck order), slug, common, scientific, family (Latin), family (English), range, [region keys], [habitats], thumb]
const B=D.birds.map(([n,slug,common,sci,famL,famE,range,regions,habs,thumb])=>({n,slug,common,sci,famL,famE,range,regions,habs,thumb}));
const KEY='qldbirds.list';
const get=k=>{try{return JSON.parse(localStorage.getItem(k))||{}}catch(e){return{}}};
const st=Object.assign({by:'order'},get(KEY));
const known=new Set(get('qldbirds.v1').known||[]);   // cards marked "Got it" in the app
const fold=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const flat=s=>fold(s).replace(/[^a-z0-9]/g,'');      // "fairy wren", "fairy-wren" and "Fairywren" all match
B.forEach(b=>b.hay=flat([b.common,b.sci,b.famL,b.famE,b.range,...b.regions.map(r=>REG[r]),...b.habs].join(' ')));
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const byName=(a,b)=>a.common.localeCompare(b.common);
const q=document.getElementById('q'),list=document.getElementById('list'),count=document.getElementById('count');

function hi(text,words){   // highlight the typed words in a name
  if(!words.length)return esc(text);
  const f=fold(text),on=new Array(text.length).fill(false);
  for(const w of words){let i=f.indexOf(w);while(i>=0){for(let j=i;j<i+w.length;j++)on[j]=true;i=f.indexOf(w,i+1);}}
  let out='',open=false;
  for(let i=0;i<text.length;i++){if(on[i]!==open){out+=on[i]?'<mark>':'</mark>';open=on[i];}out+=esc(text[i]);}
  return out+(open?'</mark>':'');
}
function row(b,words){
  return `<a class="bird" href="./#${b.slug}"><img src="${b.thumb}" alt="" loading="lazy" decoding="async" width="52" height="52">`+
    `<span class="nm"><b>${hi(b.common,words)}</b><i>${hi(b.sci,words)}</i><small>${esc(b.famE)} · ${esc(b.range)}</small></span>`+
    (known.has(b.slug)?'<span class="k">✓ known</span>':'')+'</a>';
}
function groups(items){
  const g=new Map(),add=(k,h,b)=>{if(!g.has(k))g.set(k,{h,items:[]});g.get(k).items.push(b);};
  if(st.by==='order')return[{h:'',items:items.slice().sort((a,b)=>a.n-b.n)}];
  if(st.by==='az'){items.slice().sort(byName).forEach(b=>add(b.common[0],esc(b.common[0]),b));return[...g.values()];}
  if(st.by==='region'){D.regions.forEach(([k,label])=>items.filter(b=>b.regions.includes(k)).sort(byName).forEach(b=>add(k,esc(label),b)));return[...g.values()];}
  if(st.by==='family'){items.forEach(b=>add(b.famE,`${esc(b.famE)} <i>${esc(b.famL)}</i>`,b));
    return[...g.entries()].sort((a,b)=>a[0].localeCompare(b[0])).map(([,v])=>(v.items.sort(byName),v));}
  items.forEach(b=>b.habs.forEach(h=>add(h,esc(h),b)));                         // habitat: a bird shows under each of its habitats
  return[...g.entries()].sort((a,b)=>a[0].localeCompare(b[0])).map(([,v])=>(v.items.sort(byName),v));
}
function render(){
  const words=fold(q.value).split(/[^a-z0-9]+/).filter(Boolean);
  const items=B.filter(b=>words.every(w=>b.hay.includes(w)));
  document.querySelectorAll('[data-by]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.by===st.by));
  count.textContent=words.length?`${items.length} of ${B.length}`:`${B.length} birds`;
  list.innerHTML=items.length?groups(items).map(gr=>`<section class="grp">${gr.h?`<h2>${gr.h}<span>${gr.items.length}</span></h2>`:''}`+
    gr.items.map(b=>row(b,words)).join('')+'</section>').join(''):`<p class="none">No birds match “${esc(q.value.trim())}”.</p>`;
}
document.querySelectorAll('[data-by]').forEach(x=>x.addEventListener('click',()=>{st.by=x.dataset.by;
  try{localStorage.setItem(KEY,JSON.stringify({by:st.by}))}catch(e){}render();}));
q.addEventListener('input',render);
q.addEventListener('keydown',e=>{if(e.key==='Enter'){const a=list.querySelector('.bird');if(a)location.href=a.href;}});
render();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
})();
</script>
</body>
</html>
